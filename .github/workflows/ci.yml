name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.12, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git lfs install --local
      - run: git lfs pull --include="docs/checker-tool-inventory.json,analysis/checker-v3-2026-10-23/evidence/evaluation.json"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pet/package-lock.json
      - run: npm run check
      - run: npm ci --ignore-scripts
      - run: npm run check:runtime-qualification
      - run: npm test
      - run: npm run test:package
  trainer-inputs:
    name: Frozen trainer input checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test/unit/synthesized-trainer.test.py
      - run: python -m py_compile scripts/finetune_v3_synthesized.py scripts/preflight-checker-training.py
