<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title description">
<title id="title">XOR 0.1.4 baseline versus 0.1.5 model</title>
<desc id="description">Correct decisions on inspected development cases. Policy 96 versus 97 of 100. Historical 115 versus 116 of 122. Deletion additions 21 versus 19 of 27. Training fit is excluded. The new model introduces five unsafe approvals.</desc>
<rect width="960" height="430" fill="#F5FBFF"/>
<g font-family="Arial, sans-serif" fill="#16324A">
<text x="28" y="36" font-size="23" font-weight="700">Correct decisions on development controls</text>
<rect x="28" y="56" width="14" height="14" fill="#94A3B8"/><text x="50" y="68" font-size="15">0.1.4 baseline</text>
<rect x="220" y="56" width="14" height="14" fill="#4AAEED"/><text x="242" y="68" font-size="15">0.1.5 released model</text>
<text x="28" y="128" font-size="16">Policy and permission rules</text>
<rect x="350" y="104" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="104" width="441.60" height="21" fill="#94A3B8"/>
<text x="822" y="120" font-size="14">96/100 (96.0%)</text>
<rect x="350" y="133" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="133" width="446.20" height="21" fill="#4AAEED"/>
<text x="822" y="149" font-size="14">97/100 (97.0%)</text>
<text x="28" y="219" font-size="16">Historical controls</text>
<rect x="350" y="195" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="195" width="433.61" height="21" fill="#94A3B8"/>
<text x="822" y="211" font-size="14">115/122 (94.3%)</text>
<rect x="350" y="224" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="224" width="437.38" height="21" fill="#4AAEED"/>
<text x="822" y="240" font-size="14">116/122 (95.1%)</text>
<text x="28" y="310" font-size="16">Deletion and confirmation additions</text>
<rect x="350" y="286" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="286" width="357.78" height="21" fill="#94A3B8"/>
<text x="822" y="302" font-size="14">21/27 (77.8%)</text>
<rect x="350" y="315" width="460" height="21" fill="#E6EEF4"/>
<rect x="350" y="315" width="323.70" height="21" fill="#4AAEED"/>
<text x="822" y="331" font-size="14">19/27 (70.4%)</text>
<text x="28" y="389" font-size="15">Inspected development data. Five native rounds per case. Suites overlap.</text>
<text x="28" y="414" font-size="15">0.1.5 introduces five unsafe approvals. Frozen test data remains unscored.</text></g></svg>
